<html lang="tr">

<style>
  :root { --accent:#ee5320; --ink:#3d2418; --muted:#8a6a58; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body {

    background:
      radial-gradient(60% 70% at 12% 40%, #ec4a37 0, transparent 70%),
      radial-gradient(50% 60% at 72% 10%, #f4b23e 0, transparent 70%),
      radial-gradient(55% 55% at 88% 98%, #8f86e0 0, transparent 70%),
      linear-gradient(135deg, #ee5a3d, #f0a046 55%, #c47fb4);
  }
  svg.i { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  .topbar { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:12px;
    padding:7px 7px 7px 16px; border-radius:14px; color:#fff; font-size:13px; white-space:nowrap; max-width:calc(100% - 32px);
    background:rgba(255,255,255,.2); backdrop-filter:blur(20px) saturate(1.4); border:1px solid rgba(255,255,255,.35); }
  .topbar .hint { opacity:.92; overflow:hidden; text-overflow:ellipsis; }
  kbd { font:600 11px inherit; padding:2px 6px; border-radius:5px; background:rgba(255,255,255,.3); border:1px solid rgba(255,255,255,.4); }
  .btn { border:0; border-radius:9px; padding:7px 13px; font:600 13px/1.2 inherit; font-family:inherit; cursor:pointer; background:rgba(255,255,255,.85); color:var(--ink); }

  .wl { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:5px;

  .wc small { display:block; font-size:9.5px; font-weight:600; opacity:.65; letter-spacing:.04em; }

  .backdrop { position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:16px; background:rgba(50,15,0,.2); backdrop-filter:blur(3px); }
  .modal { width:min(580px,100%); max-height:calc(100vh - 32px); display:flex; flex-direction:column; border-radius:22px; overflow:hidden;

  .mhead { position:relative; height:46px; display:grid; place-items:center; flex:none; }
  .mtitle { font-weight:700; font-size:14px; }
  .x { position:absolute; left:14px; top:12px; width:22px; height:22px; border-radius:50%; border:0; background:rgba(0,0,0,.08); color:var(--ink); cursor:pointer; font-size:15px; line-height:20px; padding:0; }
  .mbody { padding:0 18px 6px; overflow:auto; flex:1; }
  .mfoot { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-top:1px solid rgba(0,0,0,.06); flex:none; }

  canvas.draw { cursor:crosshair; touch-action:none; }
  .row { display:flex; align-items:center; gap:10px; margin:9px 0; font-size:12px; flex-wrap:wrap; }

  .segc { display:inline-flex; flex-wrap:wrap; background:rgba(255,255,255,.55); border-radius:9px; padding:2px; }

    background-image:linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.55) 33.33%,transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) 66.66%,transparent calc(66.66% + .5px)),
                     linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.55) 33.33%,transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) 66.66%,transparent calc(66.66% + .5px)); }
  .hd { position:absolute; width:14px; height:14px; background:var(--accent); border:2px solid #fff; border-radius:3px; transform:translate(-50%,-50%); }
  .hd.nw{left:0;top:0;cursor:nwse-resize} .hd.n{left:50%;top:0;cursor:ns-resize} .hd.ne{left:100%;top:0;cursor:nesw-resize} .hd.e{left:100%;top:50%;cursor:ew-resize}
  .hd.se{left:100%;top:100%;cursor:nwse-resize} .hd.s{left:50%;top:100%;cursor:ns-resize} .hd.sw{left:0;top:100%;cursor:nesw-resize} .hd.w{left:0;top:50%;cursor:ew-resize}
  table.meta { width:100%; border-collapse:collapse; font-size:12px; margin:4px 0 10px; user-select:text; }
  table.meta td { padding:7px 8px; border-bottom:1px solid rgba(0,0,0,.06); vertical-align:top; word-break:break-word; }
  table.meta td:first-child { color:var(--muted); width:38%; }
  .warn { color:#c2410c; font-weight:700; }
  .note { font-size:12px; color:var(--muted); margin:8px 0; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:200; display:flex; gap:10px; align-items:center;
    background:rgba(35,20,12,.88); color:#fff; padding:10px 16px; border-radius:12px; font-size:13px; max-width:calc(100% - 32px); }
  .spin { width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; flex:none; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (max-width:640px) { .topbar .hint { display:none; } }

  /* Electron windows: transparent, only the wheel / the tool panel is visible */
  body.desktop { background:transparent; }
  body.desktop #desk, body.desktop .topbar, body.desktop .empty { display:none; }
  /* overlay wheel: Windows 11 flyout look, system theme + accent colour */
  body.wheel { font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    --w-bg:rgba(32,32,32,.96); --w-seg:#2f2f2f; --w-fg:#e6e6e6; --w-border:rgba(255,255,255,.09); }
  body.wheel.light { --w-bg:rgba(243,243,243,.97); --w-seg:#ffffff; --w-fg:#1b1b1b; --w-border:rgba(0,0,0,.08); }
  body.wheel #wheel { transform:scale(.92); transition:transform .18s cubic-bezier(.1,.9,.2,1), opacity .12s; }
  body.wheel #wheel.open { transform:scale(1); }
  body.wheel #wheel .ring { background:var(--w-bg); backdrop-filter:none; border:1px solid var(--w-border); box-shadow:0 8px 26px rgba(0,0,0,.32); }
  body.wheel .seg { fill:var(--w-seg); stroke:var(--w-seg); }
  body.wheel .seg.hot { fill:url(#hot); stroke:url(#hot); }
  body.wheel .wl { color:var(--w-fg); font-weight:600; letter-spacing:.04em; }
  body.wheel .wl.hot { color:#fff; }
  body.wheel .wc { background:var(--w-seg); color:var(--w-fg); border:1px solid var(--w-border); box-shadow:none; }
  body.editor .backdrop, body.help .backdrop { background:transparent; backdrop-filter:none; padding:0; }
  body.editor .modal, body.help .modal { width:100%; height:100vh; max-height:100vh; animation:none; }
  body.editor .mhead, body.help .mhead { -webkit-app-region:drag; }
  body.editor .mhead button, body.help .mhead button { -webkit-app-region:no-drag; }
  .helpok { display:flex; align-items:center; gap:8px; font-weight:600; color:#15803d; margin:4px 0 12px; }
  .helpok i { width:9px; height:9px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.2); }
  .steps { margin:0; padding-left:20px; font-size:13px; line-height:1.9; user-select:text; }
</style>
</head>
<body>
<div id="desk"></div>
<div class="empty"><div class="box"><b>Dosyaları buraya bırak</b>PDF, görsel ya da metin dosyası sürükle.<br>Sürüklerken <kbd>Shift</kbd>'e bas → çark açılır → bir işlemin üstüne bırak.</div></div>
<div class="topbar"><b>Drag + Shift</b><span class="hint">Sürükle → <kbd>Shift</kbd> → işleme bırak · Görsellerde tekrar <kbd>Shift</kbd> = Convert · Çift tık = indir</span><button class="btn" id="add">Dosya ekle</button></div>
<input type="file" id="picker" multiple hidden>
<div id="wheel"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'node_modules/pdfjs-dist/build/pdf.worker.min.js';

const DESKTOP_MODE = window.desktop ? new URLSearchParams(location.search).get('mode') : null;

};
const ICON = {

  tag: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  rotate: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
  crop: '<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>',
  eyeoff: '<path d="M9.9 4.2A10 10 0 0 1 12 4c7 0 10 8 10 8a13 13 0 0 1-1.7 2.7M6.6 6.6A13 13 0 0 0 2 12s3 8 10 8a9.7 9.7 0 0 0 5.4-1.6"/><path d="M2 2l20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',

const svgIcon = name => `<svg class="i" viewBox="0 0 24 24">${ICON[name]}</svg>`;

const baseName = n => n.replace(/\.[^.]+$/, '');
const pad = n => String(n).padStart(3, '0');
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(2) + ' MB';
const escXml = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const loadImage = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Görsel açılamadı')); i.src = src; });

const IMG_EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };
const keepType = f => IMG_EXT[f.blob.type] ? f.blob.type : 'image/png';

let toastEl = null;

  toastEl?.remove();
  const el = h('div', { class: 'toast' }, spin ? h('div', { class: 'spin' }) : null, msg);
  document.body.append(el); toastEl = el;
  const close = () => { if (toastEl === el) toastEl = null; el.remove(); };
  if (ms) setTimeout(close, ms);

// ---------- desktop files
const desk = document.getElementById('desk');
const files = new Map();
let seq = 0, selected = null;

function addFile(blob, name, pos) {
  const f = { id: ++seq, name, blob, kind: kindOf(blob.type, name), url: URL.createObjectURL(blob) };
  const p = findFree(pos?.x ?? innerWidth - 140, pos?.y ?? 80);
  f.x = p.x; f.y = p.y;
  f.thumb = h('div', { class: 'thumb' });
  f.el = h('div', { class: 'icon new' }, f.thumb, h('div', { class: 'label' }, name),
    h('button', { class: 'dl', title: 'İndir', html: svgIcon('download'),
      onpointerdown: e => e.stopPropagation(), onclick: e => { e.stopPropagation(); download(f); } }));
  place(f);
  desk.append(f.el);
  files.set(f.id, f);
  makeThumb(f);
  bindIcon(f);
  updateEmpty();
  setTimeout(() => f.el.classList.remove('new'), 600);

}
async function makeThumb(f) {

    if (f.kind === 'image') { t.append(h('img', { src: f.url, draggable: 'false' })); return; }
    if (f.kind === 'pdf') {
      const page = await (await openPdf(f.blob)).getPage(1);
      const vp = page.getViewport({ scale: 128 / page.getViewport({ scale: 1 }).width });
      const c = canvasOf(vp.width, vp.height);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      t.append(h('img', { src: c.toDataURL(), draggable: 'false' })); // img, not canvas, so the drag ghost can clone it

function findFree(x, y, ignore) {

    h('table', { class: 'meta' }, Object.entries(base).map(([k, val]) => tr(k, val))),
    h('div', { class: 'note' }, hasMeta ? 'Gömülü metadata:' : 'Gömülü metadata (EXIF/XMP/PNG text) bulunamadı.'),
    hasMeta ? h('table', { class: 'meta' }, Object.entries(meta).map(([k, val]) => tr(k, val))) : null,
    h('div', { class: 'note' }, '“Remove Metadata” görseli yeniden kodlar; EXIF, GPS ve diğer gömülü bilgiler silinmiş temiz bir kopya oluşturur.'));
  m.onSave = async () => {
    const c = canvasOf(img.naturalWidth, img.naturalHeight);
    c.getContext('2d').drawImage(img, 0, 0);
    const t = keepType(f);
    return [{ blob: await exportCanvas(c, t, .95), name: named(f, 'Clean', t) }];
  };
  return m.result;
}

updateEmpty();

// ---------- Electron: global overlay wheel + tool windows
const MIME = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', bmp: 'image/bmp',
  avif: 'image/avif', svg: 'image/svg+xml', txt: 'text/plain', md: 'text/markdown', csv: 'text/csv', json: 'application/json', log: 'text/plain', html: 'text/html', htm: 'text/html', xml: 'text/xml' };
const dirOf = p => p ? p.replace(/[\\/][^\\/]*$/, '') : '';
async function saveOutputs(outs, srcPath) {
  let last;
  for (const o of outs) last = await window.desktop.save(dirOf(srcPath), o.name, new Uint8Array(await o.blob.arrayBuffer()));
  window.desktop.notify('✓ ' + (outs.length > 1 ? `${outs.length} dosya kaydedildi` : outs[0].name), last);
}
if (DESKTOP_MODE) document.body.classList.add('desktop', DESKTOP_MODE);

if (DESKTOP_MODE === 'wheel') {
  const D = window.desktop, q = new URLSearchParams(location.search);
  if (q.get('theme') === 'light') document.body.classList.add('light');
  const acc = q.get('accent');
  if (/^[0-9a-f]{6}/i.test(acc)) {
    const darker = '#' + [0, 2, 4].map(i => Math.round(parseInt(acc.slice(i, i + 2), 16) * .78).toString(16).padStart(2, '0')).join('');
    document.documentElement.style.setProperty('--acc', '#' + acc.slice(0, 6));
    document.documentElement.style.setProperty('--acc2', darker);
  }
  let kind = null;
  const show = k => { kind = k; openWheel(innerWidth / 2, innerHeight / 2, k); };
  D.onShow(() => show('other'));
  D.onHide(closeWheel);
  D.onCycle(() => { if (wheel.open) cycleMode(); });
  const over = e => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    const k = dragKind(e);
    if (!wheel.open || k !== kind) show(k);
    updateHover(e.clientX, e.clientY);
  };
  window.addEventListener('dragenter', over);
  window.addEventListener('dragover', over);
  window.addEventListener('dragleave', () => setHover(null));
  window.addEventListener('drop', async e => {
    e.preventDefault();
    const act = wheel.hover;
    const list = [...e.dataTransfer.files].map(file => ({ file, path: D.pathFor(file) }));
    closeWheel(); D.hide();
    if (!act) return;
    for (const { file, path } of list) {
      const k = kindOf(file.type, file.name), a = ACTIONS[k]?.[act];
      if (!a) continue;
      if (a.modal) { D.openEditor(path, act); continue; }
      try {
        const f = { name: file.name, blob: file, kind: k, url: URL.createObjectURL(file) };
        const outs = await a.run(f);
        URL.revokeObjectURL(f.url);
        if (outs?.length) await saveOutputs(outs, path);
      } catch (err) { console.error(err); D.notify('Hata: ' + (err.message || err)); }
    }
  });
}

if (DESKTOP_MODE === 'help') (async () => {
  const m = openModal('Drag + Shift', { primary: 'Tamam', reset: false });
  m.body.append(
    h('div', { class: 'helpok' }, h('i'), 'Arka planda çalışıyor'),
    h('ol', { class: 'steps' },
      h('li', {}, 'Masaüstünde ya da Explorer\'da bir dosyayı tut ve sürükle.'),
      h('li', {}, 'Sürüklerken ', h('kbd', {}, 'Shift'), '\'e bas — imlecin altında çark açılır.'),
      h('li', {}, 'Dosyayı bir işlemin üstüne bırak; sonuç dosyanın yanına kaydedilir.'),
      h('li', {}, 'Görsellerde tekrar ', h('kbd', {}, 'Shift'), ' = Convert çarkı. ', h('kbd', {}, 'Esc'), ' = kapat.')),
    h('div', { class: 'note' }, 'Bu pencereyi kapatabilirsin; uygulama saatin yanındaki turuncu noktada çalışmaya devam eder.'));
  m.onSave = async () => null;
  await m.result;
  window.desktop.close();
})();

if (DESKTOP_MODE === 'editor') (async () => {
  const D = window.desktop, q = new URLSearchParams(location.search), path = q.get('file'), tool = q.get('tool');
  try {
    const name = path.split(/[\\/]/).pop(), ext = (name.match(/\.([^.]+)$/)?.[1] || '').toLowerCase();
    const blob = new Blob([await D.read(path)], { type: MIME[ext] || '' });
    const f = { name, blob, kind: kindOf(blob.type, name), url: URL.createObjectURL(blob) };
    const outs = await ACTIONS[f.kind][tool].run(f);
    if (outs?.length) await saveOutputs(outs, path);
  } catch (err) { console.error(err); D.notify('Hata: ' + (err.message || err)); }
  D.close();
})();
</script>
