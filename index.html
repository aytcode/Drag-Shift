<style>
  :root { --accent:#1f7aff; --ink:#1b2f4f; --muted:#4d6a92; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body {

  .btn { border:0; border-radius:9px; padding:7px 13px; font:600 13px/1.2 inherit; font-family:inherit; cursor:pointer; background:rgba(255,255,255,.85); color:var(--ink); }
  .btn:hover { filter:brightness(1.04); }

  #desk { position:fixed; inset:0; }
  .empty { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; color:#fff; text-align:center; padding:16px; }
  .empty .box { border:2px dashed rgba(255,255,255,.6); border-radius:28px; padding:36px 44px; font-size:15px; line-height:1.7; transition:background .2s, border-color .2s; }
  .empty .box b { font-size:20px; display:block; margin-bottom:4px; }

  .icon { position:absolute; width:100px; display:flex; flex-direction:column; align-items:center; gap:5px; touch-action:none;
    transition:left .35s cubic-bezier(.2,1.2,.4,1), top .35s cubic-bezier(.2,1.2,.4,1), opacity .15s; }
  .thumb { width:76px; height:82px; display:grid; place-items:center; border-radius:7px; }
  .thumb img { max-width:64px; max-height:74px; background:#fff; border-radius:2px; box-shadow:0 2px 6px rgba(0,0,0,.25); pointer-events:none; }
  .icon.sel .thumb { background:rgba(0,0,0,.16); }
  .label { font-size:12px; font-weight:600; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.45); padding:1px 6px; border-radius:5px; max-width:104px;
    text-align:center; word-break:break-word; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .icon.sel .label, .ghost .label { background:#2a64f6; text-shadow:none; }
  .icon.lifting { opacity:.45; }
  .icon.new .thumb { animation:pop .5s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform:scale(.4); opacity:0; } }
  .icon .dl { position:absolute; top:-6px; right:4px; width:26px; height:26px; border-radius:50%; border:0; background:#fff; color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,.25); cursor:pointer; opacity:0; transition:opacity .15s; display:grid; place-items:center; padding:0; }
  .icon .dl svg.i { width:14px; height:14px; }
  .icon:hover .dl { opacity:1; }
  .doc { width:56px; height:72px; background:#fff; border-radius:2px; box-shadow:0 2px 6px rgba(0,0,0,.25); padding:5px; overflow:hidden;
    font:4px/1.35 ui-monospace,monospace; color:#555; white-space:pre-wrap; word-break:break-all; text-align:left; }
  .doc.ext { display:grid; place-items:center; font:800 11px/1 inherit; font-family:inherit; color:var(--accent); }

  .ghost { position:fixed; z-index:60; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:4px; transform:translate(-50%,-55%); opacity:.92; }
  .ghost .thumb { position:relative; }
  .ghost .plus { position:absolute; right:-4px; bottom:-4px; width:24px; height:24px; border-radius:50%; background:#2fbf4f; color:#fff; border:2px solid #fff;
    font:700 17px/20px sans-serif; text-align:center; transform:scale(0); transition:transform .18s cubic-bezier(.2,1.6,.4,1); }
  .ghost.ok .plus { transform:scale(1); }

  /* ---- wheel: warm frosted glass (SIZE 652, centre 326, rim radius 216) ---- */
  #wheel { position:fixed; z-index:50; pointer-events:none; visibility:hidden; opacity:0; will-change:transform,opacity;
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  #wheel .glass { position:absolute; left:70px; top:70px; width:512px; height:512px; clip-path:circle(216px at 50% 50%);
    opacity:0; transition:opacity .25s; background-repeat:no-repeat; }
  #wheel .glass.on { opacity:1; }
  #wheel .ring { position:absolute; left:110px; top:110px; width:432px; height:432px; border-radius:50%;
    background:radial-gradient(circle at 50% 28%, rgba(246,250,255,.88), rgba(214,230,255,.82) 72%);
    backdrop-filter:blur(24px) saturate(1.8);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:0 26px 60px rgba(10,40,120,.26), 0 3px 8px rgba(10,40,120,.12), inset 0 1.5px 1px rgba(255,255,255,.95), inset 0 -14px 34px rgba(120,170,255,.16); }
  #wheel .glass.on + .ring { background:radial-gradient(circle at 50% 28%, rgba(240,247,255,.84), rgba(196,220,255,.78) 75%); }
  #wheel > svg { position:absolute; inset:0; overflow:visible; }
  #wheel svg.subs { filter:drop-shadow(0 12px 22px rgba(10,40,120,.22)); }
  .seg { fill:url(#segfill); stroke:url(#segfill); stroke-width:12; stroke-linejoin:round; transition:fill .18s, stroke .18s; }
  .sg { transition:transform .42s cubic-bezier(.34,1.5,.64,1), opacity .22s; }
  .sg.hot { transform:translate(var(--dx), var(--dy)); }
  .sg.hot .seg, .sg.sub.hot .seg { fill:url(#hot); stroke:url(#hot); filter:url(#hotglow); }
  .sg.open .seg { fill:#d6e6ff; stroke:#d6e6ff; }
  .sg.sub { opacity:0; transform:scale(.84); transform-origin:326px 326px; transform-box:view-box; }
  .sg.sub .seg { fill:rgba(242,247,255,.96); stroke:rgba(242,247,255,.96); }
  #wheel.expanded .sg.sub { opacity:1; transform:none; }
  .wl { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:6px; white-space:nowrap;
    font-weight:650; font-size:11.5px; letter-spacing:.07em; color:#24406b; text-shadow:0 1px 0 rgba(255,255,255,.55);
    transition:transform .42s cubic-bezier(.34,1.5,.64,1), color .15s, opacity .22s; }
  .wl svg.i { width:20px; height:20px; stroke-width:1.7; }
  .wl.hot { color:#fff; text-shadow:0 1px 2px rgba(0,40,140,.35); transform:translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,0px))) scale(1.06); }
  .wl.sub { font-size:10.5px; opacity:0; transform:translate(-50%,-50%) scale(.8); }
  #wheel.expanded .wl.sub { opacity:1; transform:translate(-50%,-50%); }
  #wheel.expanded .wl.sub.hot { transform:translate(-50%,-50%) scale(1.08); }
  .wc { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); min-width:118px; max-width:150px; padding:11px 18px; border-radius:999px;
    text-align:center; background:linear-gradient(180deg,#ffffff,#e4efff); color:#1f3a63; line-height:1.25;
    box-shadow:inset 0 1px 0 #fff, inset 0 -1px 0 rgba(60,110,200,.15), 0 8px 20px rgba(20,60,150,.22); }
  .wc b { font-size:13px; letter-spacing:.08em; }
  .wc small { display:block; font-size:9.5px; font-weight:600; opacity:.6; letter-spacing:.04em; margin-top:1px; }
  .wc.pulse { animation:wcpulse .32s cubic-bezier(.34,1.6,.64,1); }
  @keyframes wcpulse { from { transform:translate(-50%,-50%) scale(.92); } }
  @media (prefers-reduced-motion: reduce) { .sg, .wl, .wc { transition:none !important; animation:none !important; } }
  @media (prefers-reduced-transparency: reduce) { #wheel .glass { display:none; } #wheel .ring { background:#e6f0ff; backdrop-filter:none; } }

  .backdrop { position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:16px; background:rgba(0,15,50,.2); backdrop-filter:blur(3px); }
  .modal { width:min(580px,100%); max-height:calc(100vh - 32px); display:flex; flex-direction:column; border-radius:22px; overflow:hidden;
    background:linear-gradient(180deg,rgba(188,216,255,.95),rgba(238,245,255,.97)); border:1px solid rgba(255,255,255,.7);
    box-shadow:0 40px 90px rgba(0,20,80,.35); animation:pop .35s cubic-bezier(.2,1.2,.4,1); user-select:none; }
  .mhead { position:relative; height:46px; display:grid; place-items:center; flex:none; }
  .mtitle { font-weight:700; font-size:14px; }
  .x { position:absolute; left:14px; top:12px; width:22px; height:22px; border-radius:50%; border:0; background:rgba(0,0,0,.08); color:var(--ink); cursor:pointer; font-size:15px; line-height:20px; padding:0; }
  .mbody { padding:0 18px 6px; overflow:auto; flex:1; }
  .mfoot { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-top:1px solid rgba(0,0,0,.06); flex:none; }
  .preview { display:grid; place-items:center; border-radius:14px; padding:12px; margin-bottom:10px;
    background:repeating-conic-gradient(rgba(0,0,0,.05) 0 25%, rgba(255,255,255,.35) 0 50%) 0 0/16px 16px; }
  .preview canvas, .preview > img { max-width:100%; max-height:330px; display:block; }
  canvas.draw { cursor:crosshair; touch-action:none; }
  .row { display:flex; align-items:center; gap:10px; margin:9px 0; font-size:12px; flex-wrap:wrap; }
  .row > label { width:86px; color:var(--muted); flex:none; }
  .row input[type=range] { flex:1; min-width:120px; accent-color:var(--accent); }
  .val { width:64px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .row input[type=number] { width:80px; padding:5px 8px; border-radius:7px; border:1px solid rgba(0,0,0,.12); background:rgba(255,255,255,.7); font:inherit; color:var(--ink); }
  .segc { display:inline-flex; flex-wrap:wrap; background:rgba(255,255,255,.55); border-radius:9px; padding:2px; }
  .segc button { border:0; background:none; padding:5px 11px; border-radius:7px; font:600 12px inherit; font-family:inherit; color:#3d5a82; cursor:pointer; }
  .segc button.on { background:var(--accent); color:#fff; }
  .swatches { display:flex; flex-wrap:wrap; gap:6px; flex:1; }
  .sw { width:32px; height:24px; border-radius:6px; border:2px solid transparent; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); padding:0; }
  .sw.on { border-color:var(--accent); }
  .sw input { opacity:0; width:100%; height:100%; cursor:pointer; }
  .cropstage { position:relative; overflow:hidden; touch-action:none; }
  .cropstage img { width:100%; height:100%; display:block; pointer-events:none; }
  .cropbox { position:absolute; cursor:move; outline:2px solid #fff; box-shadow:0 0 0 9999px rgba(35,22,15,.55);
    background-image:linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.55) 33.33%,transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) 66.66%,transparent calc(66.66% + .5px)),
                     linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.55) 33.33%,transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.55) 66.66%,transparent calc(66.66% + .5px)); }
  .hd { position:absolute; width:14px; height:14px; background:var(--accent); border:2px solid #fff; border-radius:3px; transform:translate(-50%,-50%); }
  .hd.nw{left:0;top:0;cursor:nwse-resize} .hd.n{left:50%;top:0;cursor:ns-resize} .hd.ne{left:100%;top:0;cursor:nesw-resize} .hd.e{left:100%;top:50%;cursor:ew-resize}
  .hd.se{left:100%;top:100%;cursor:nwse-resize} .hd.s{left:50%;top:100%;cursor:ns-resize} .hd.sw{left:0;top:100%;cursor:nesw-resize} .hd.w{left:0;top:50%;cursor:ew-resize}
  table.meta { width:100%; border-collapse:collapse; font-size:12px; margin:4px 0 10px; user-select:text; }
  table.meta td { padding:7px 8px; border-bottom:1px solid rgba(0,0,0,.06); vertical-align:top; word-break:break-word; }
  table.meta td:first-child { color:var(--muted); width:38%; }
  .warn { color:#c2410c; font-weight:700; }
  .note { font-size:12px; color:var(--muted); margin:8px 0; }
  .snack { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:200; display:flex; gap:10px; align-items:center;
    background:rgba(12,20,35,.88); color:#fff; padding:10px 16px; border-radius:12px; font-size:13px; max-width:calc(100% - 32px); }
  .spin { width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; flex:none; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (max-width:640px) { .topbar .hint { display:none; } }

  /* Electron windows: transparent, only the wheel / the tool panel is visible */
  body.desktop { background:transparent; }
  body.desktop #desk, body.desktop .topbar, body.desktop .empty { display:none; }
  body.editor .backdrop, body.help .backdrop { background:transparent; backdrop-filter:none; padding:0; }
  body.editor .modal, body.help .modal { width:100%; height:100vh; max-height:100vh; animation:none; }
  body.editor .mhead, body.help .mhead { -webkit-app-region:drag; }
  body.editor .mhead button, body.help .mhead button { -webkit-app-region:no-drag; }
  body.editor .mbody { display:flex; gap:16px; padding:0 18px 12px; overflow:hidden; }
  body.editor .stagecol { flex:1; min-width:0; display:flex; }
  body.editor .stagecol .preview { flex:1; margin:0; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  body.editor .preview canvas, body.editor .preview > img { max-width:100%; max-height:100%; }
  body.editor .sidecol { width:330px; flex:none; overflow:auto; padding-right:2px; }
  body.editor .stagecol:empty { display:none; }
  body.editor .stagecol:empty + .sidecol { width:auto; flex:1; }
  body.editor .sidecol .row > label { width:100px; }
  .helpok { display:flex; align-items:center; gap:8px; font-weight:600; color:#15803d; margin:4px 0 12px; }
  .helpok i { width:9px; height:9px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.2); }
  .steps { margin:0; padding-left:20px; font-size:13px; line-height:1.9; user-select:text; }

  /* ---- warm glass panels (tool windows, help, progress card) ---- */
  .modal { border-radius:26px; font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    background:linear-gradient(180deg,#bcd8ff 0%,#d9e9ff 16%,#eef5ff 52%,#f6faff 100%);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 40px 90px rgba(5,30,90,.32), 0 4px 12px rgba(5,30,90,.12), inset 0 1.5px 0 rgba(255,255,255,.95); }
  body.editor .modal, body.help .modal { animation:materialize .42s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes materialize { from { opacity:0; transform:scale(.965); filter:blur(8px); } }
  .mhead { height:54px; }
  .mtitle { font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; font-size:15px; font-weight:650; letter-spacing:-.01em; color:#1b2f4f; }
  .x { left:16px; top:16px; width:22px; height:22px; background:rgba(20,50,120,.12); color:#24406b; transition:background .15s, transform .1s; }
  .x:hover { background:#ff5f57; color:#fff; } .x:active { transform:scale(.92); }
  .mfoot { padding:14px 20px 16px; border-top:1px solid rgba(40,80,160,.10); }
  .btn { border-radius:12px; padding:8px 16px; font-weight:600; transition:transform .1s, filter .15s, box-shadow .15s; }
  .btn:active { transform:scale(.97); }
  .btn.primary { background:linear-gradient(180deg,#5aa8ff,#1f7aff 60%,#0b62e6); box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 6px 16px rgba(30,110,240,.35); }
  .btn.soft { background:rgba(255,255,255,.7); box-shadow:inset 0 1px 0 #fff, 0 1px 3px rgba(20,50,120,.12); color:#1f3a63; }
  .preview { border-radius:18px; padding:16px; box-shadow:inset 0 1px 3px rgba(20,50,120,.12);
    background:repeating-conic-gradient(rgba(50,90,160,.06) 0 25%, rgba(255,255,255,.55) 0 50%) 0 0/18px 18px; }
  .preview canvas, .preview > img, .cropstage { box-shadow:0 10px 30px rgba(5,30,90,.18); border-radius:4px; }
  .row { margin:12px 0; font-size:12.5px; } .row > label { color:#4d6a92; font-weight:500; }
  .val { color:#4d6a92; }
  .segc { background:rgba(255,255,255,.62); border-radius:11px; padding:3px; box-shadow:inset 0 1px 2px rgba(20,50,120,.10); }
  .segc button { border-radius:8px; padding:6px 12px; transition:background .18s, color .18s; }
  .segc button.on { background:linear-gradient(180deg,#5aa8ff,#1f7aff); box-shadow:0 2px 6px rgba(30,110,240,.35); }
  .row input[type=number], .row input[type=text] { border-radius:9px; border:1px solid rgba(40,80,160,.18); background:rgba(255,255,255,.8); padding:6px 9px; font:inherit; color:#1b2f4f; }
  input[type=range] { -webkit-appearance:none; appearance:none; height:22px; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:4px; background:linear-gradient(90deg,#1f7aff,#6cb4ff); opacity:.85; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; margin-top:-8px; border-radius:50%; background:#fff;
    box-shadow:0 1px 1px rgba(0,0,0,.08), 0 3px 8px rgba(10,40,120,.3); transition:transform .12s; }
  input[type=range]:active::-webkit-slider-thumb { transform:scale(1.12); }
  .sw { border-radius:8px; width:34px; height:26px; transition:transform .12s; } .sw:hover { transform:translateY(-1px); }
  .sw.on { border-color:#fff; box-shadow:0 0 0 2px #1f7aff; }
  body.editor .sidecol { padding:4px 4px 8px; }

  /* progress card */
  body.toast { background:transparent; }
  .tcard { position:fixed; left:10px; right:10px; top:10px; padding:16px 18px 16px 18px; border-radius:20px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 14px; align-items:center;
    background:linear-gradient(180deg,rgba(246,250,255,.97),rgba(214,230,255,.96)); border:1px solid rgba(255,255,255,.85);
    box-shadow:0 18px 40px rgba(5,30,90,.28), inset 0 1px 0 #fff; font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; color:#1b2f4f;
    transition:opacity .25s, transform .35s cubic-bezier(.2,.9,.25,1), filter .25s; }
  .tcard.out { opacity:0; transform:translateY(8px) scale(.97); filter:blur(6px); }
  .tcard .ic { grid-row:1 / span 2; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff;
    background:linear-gradient(180deg,#5aa8ff,#0b62e6); box-shadow:0 4px 10px rgba(30,110,240,.35); }
  .tcard.error .ic { background:linear-gradient(180deg,#ff6b6b,#d42a2a); }
  .tcard .tt { font-weight:650; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tcard .ts { font-size:11.5px; color:#4d6a92; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; grid-column:2; }
  .tcard .bar { grid-column:1 / -1; height:4px; border-radius:4px; background:rgba(40,80,160,.14); overflow:hidden; margin-top:4px; }
  .tcard .bar i { display:block; height:100%; width:35%; border-radius:4px; background:linear-gradient(90deg,#6cb4ff,#1f7aff); animation:indet 1.1s ease-in-out infinite; }
  .tcard.done .bar i, .tcard.error .bar i { width:100%; animation:none; transition:width .3s; }
  .tcard.error .bar i { background:#e04848; }
  @keyframes indet { from { transform:translateX(-100%); } to { transform:translateX(290%); } }
  .tcard .go { grid-row:1 / span 2; grid-column:3; }
  .tcard .go[hidden] { display:none; }
</style>
</head>
<body>
<div id="desk"></div>
<div class="empty"><div class="box"><b>Dosyaları buraya bırak</b>PDF, görsel ya da metin dosyası sürükle.<br>Sürüklerken <kbd>Shift</kbd>'e bas → çark açılır → bir işlemin üstüne bırak.</div></div>
<div class="topbar"><b>Drag + Shift</b><span class="hint">Sürükle → <kbd>Shift</kbd> → işleme bırak · Görsellerde tekrar <kbd>Shift</kbd> = Convert · Çift tık = indir</span><button class="btn" id="add">Dosya ekle</button></div>
<input type="file" id="picker" multiple hidden>
<div id="wheel"></div>

      body,

async function cropTool(f) {
  const img = await loadImage(f.url), W = img.naturalWidth, H = img.naturalHeight;
  const m = openModal('Crop Image', { primary: 'Apply' });
  const room = stageRoom(), s = Math.min(DESKTOP_MODE === 'editor' ? 3 : 1, room.w / W, room.h / H);
  const box = h('div', { class: 'cropbox' }, ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map(k => h('div', { class: 'hd ' + k, 'data-h': k })));
  const stage = h('div', { class: 'cropstage', style: { width: W * s + 'px', height: H * s + 'px' } }, h('img', { src: f.url, draggable: 'false' }), box);
  const wIn = h('input', { type: 'number', min: 20, max: W }), hIn = h('input', { type: 'number', min: 20, max: H });
  let r = { x: 0, y: 0, w: W, h: H }, ratio = null;

    wIn.value = Math.round(r.w); hIn.value = Math.round(r.h);
  };
  const fitRatio = () => {
    if (!ratio) return;
    let w = W, hh = W / ratio; if (hh > H) { hh = H; w = H * ratio; }
    r = { x: (W - w) / 2, y: (H - hh) / 2, w, h: hh };

  };

    null, v => { ratio = v; fitRatio(); draw(); });

    const c = canvasOf(r.w, r.h);

}

  { t: 'grad', c: ['#43cea2', '#185a9d'] }, { t: 'grad', c: ['#232526', '#414345'] },

    x.drawImage(img, 0, 0, c.width, c.height);

      const R = [r.x * sc, r.y * sc, r.w * sc, r.h * sc];
      if (r.mode === 'black') { x.fillStyle = '#000'; x.fillRect(...R); }

        t.getContext('2d').drawImage(img, r.x, r.y, r.w, r.h, 0, 0, t.width, t.height);

  }

  const norm = (a, b) => ({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y), mode });

  });

    row('Stil', segmented([{ l: 'Black', v: 'black' }, { l: 'Blur', v: 'blur' }, { l: 'Pixelate', v: 'pixel' }], mode, v => { mode = v; }),
      h('button', { class: 'btn soft', onclick: () => { rects.pop(); redraw(); } }, 'Undo')),
    h('div', { class: 'note' }, t('Gizlemek istediğin alanların üstüne kutu çiz.')));

  m.onSave = async () => { const c = document.createElement('canvas'); render(c, 1); const t = keepType(f); return [{ blob: await exportCanvas(c, t, .95), name: named(f, 'Redacted', t) }]; };
  return m.result;
}

async function annotateTool(f) {
  const img = await loadImage(f.url), W = img.naturalWidth, H = img.naturalHeight;
  const m = openModal('Annotate');
  const cv = h('canvas', { class: 'draw' });
  const COLORS = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#007aff', '#000000', '#ffffff'];
  let strokes = [], tool = 'pen', color = COLORS[0], size = Math.max(2, Math.round(Math.max(W, H) / 250));
  function arrow(x, a, b, w) {
    const ang = Math.atan2(b.y - a.y, b.x - a.x), L = w * 4;
    x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y);
    x.moveTo(b.x, b.y); x.lineTo(b.x - L * Math.cos(ang - .45), b.y - L * Math.sin(ang - .45));
    x.moveTo(b.x, b.y); x.lineTo(b.x - L * Math.cos(ang + .45), b.y - L * Math.sin(ang + .45));
    x.stroke();
  }
  function render(c, sc) {
    c.width = Math.round(W * sc); c.height = Math.round(H * sc);
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, c.width, c.height);
    x.setTransform(sc, 0, 0, sc, 0, 0); x.lineCap = 'round'; x.lineJoin = 'round';
    for (const s of strokes) {
      x.save(); x.strokeStyle = s.color; x.lineWidth = s.size;
      if (s.tool === 'hl') { x.globalAlpha = .4; x.lineWidth = s.size * 4; x.globalCompositeOperation = 'multiply'; }
      const [a, b] = [s.pts[0], s.pts[s.pts.length - 1]];
      if (s.tool === 'arrow') arrow(x, a, b, s.size);
      else if (s.tool === 'box') x.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
      else { x.beginPath(); s.pts.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y)); if (s.pts.length === 1) x.lineTo(a.x + .1, a.y); x.stroke(); }
      x.restore();
    }
  }
  const sc = previewScale(W, H), redraw = () => render(cv, sc);
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    const toImg = p => ({ x: p.x / sc, y: p.y / sc });
    const s = { tool, color, size, pts: [toImg(canvasPoint(cv, e))] };
    strokes.push(s); redraw();
    cv.onpointermove = ev => { const p = toImg(canvasPoint(cv, ev)); if (tool === 'pen' || tool === 'hl') s.pts.push(p); else s.pts[1] = p; redraw(); };
    cv.onpointerup = () => { cv.onpointermove = cv.onpointerup = null; };
  });
  const sws = COLORS.map(c => h('button', { class: 'sw' + (c === color ? ' on' : ''), style: { background: c }, onclick: e => { color = c; sws.forEach(s => s.classList.toggle('on', s === e.currentTarget)); } }));
  m.body.append(h('div', { class: 'preview' }, cv),
    row('Araç', segmented([{ l: 'Pen', v: 'pen' }, { l: 'Highlight', v: 'hl' }, { l: 'Arrow', v: 'arrow' }, { l: 'Box', v: 'box' }], tool, v => { tool = v; }),
      h('button', { class: 'btn soft', onclick: () => { strokes.pop(); redraw(); } }, 'Undo')),
    row('Renk', h('div', { class: 'swatches' }, sws)),
    slider('Kalınlık', 1, Math.max(20, Math.round(Math.max(W, H) / 40)), size, 'px', v => { size = v; }));
  redraw();
  m.onReset = () => { strokes = []; redraw(); };
  m.onSave = async () => { const c = document.createElement('canvas'); render(c, 1); const t = keepType(f); return [{ blob: await exportCanvas(c, t, .95), name: named(f, 'Annotated', t) }]; };
  return m.result;
}

async function compressTool(f) {
  const img = await loadImage(f.url), W = img.naturalWidth, H = img.naturalHeight;
  const def = { fmt: f.blob.type === 'image/png' ? 'image/webp' : 'image/jpeg', q: 75, max: 0 };
  let st = { ...def }, timer, lastUrl;
  const m = openModal('Compress', { primary: 'Save' });
  const out = h('img'), info = h('div', { class: 'note' }, 'Hesaplanıyor…');
  async function build() {
    let w = W, hh = H;
    if (st.max && Math.max(W, H) > st.max) { const k = st.max / Math.max(W, H); w = W * k; hh = H * k; }
    const c = canvasOf(w, hh);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { blob: await exportCanvas(c, st.fmt, st.q / 100), w: c.width, h: c.height };
  }
  const update = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const r = await build();
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      out.src = lastUrl = URL.createObjectURL(r.blob);
      const pct = Math.round((1 - r.blob.size / f.blob.size) * 100);
      info.innerHTML = `${fmtSize(f.blob.size)} → <b>${fmtSize(r.blob.size)}</b> (${pct >= 0 ? '−' + pct : '+' + -pct}%) · ${r.w}×${r.h}px`;
    }, 120);
  };
  const fmts = segmented([{ l: 'JPG', v: 'image/jpeg' }, { l: 'WEBP', v: 'image/webp' }], st.fmt, v => { st.fmt = v; update(); });
  const q = slider('Kalite', 10, 100, st.q, '%', v => { st.q = v; update(); });
  const maxes = segmented([{ l: 'Orijinal', v: 0 }, { l: '2560', v: 2560 }, { l: '1920', v: 1920 }, { l: '1280', v: 1280 }, { l: '800', v: 800 }], 0, v => { st.max = v; update(); });
  m.body.append(h('div', { class: 'preview' }, out), info, row('Format', fmts), q, row('Maks. kenar', maxes));
  update();
  m.onReset = () => { st = { ...def }; fmts.set(st.fmt); q.set(st.q); maxes.set(0); update(); };
  m.onSave = async () => { const r = await build(); return [{ blob: r.blob, name: named(f, 'Compressed', st.fmt) }]; };
  return m.result;
}

async function readMeta(blob) {
  const v = new DataView(await blob.slice(0, 512 * 1024).arrayBuffer()), out = {};
  const ascii = (o, n) => { let s = ''; for (let k = 0; k < n && o + k < v.byteLength; k++) s += String.fromCharCode(v.getUint8(o + k)); return s; };
  if (v.byteLength > 4 && v.getUint16(0) === 0xFFD8) { // JPEG: walk segments to APP1/Exif
    let o = 2;
    while (o + 4 < v.byteLength) {
      const mk = v.getUint16(o), len = v.getUint16(o + 2);
      if ((mk & 0xFF00) !== 0xFF00 || mk === 0xFFDA) break;
      if (mk === 0xFFE1 && ascii(o + 4, 4) === 'Exif') parseExif(v, o + 10, out);
      if (mk === 0xFFE1 && ascii(o + 4, 4) === 'http') out['XMP'] = 'Var';
      o += 2 + len;
    }
  } else if (v.byteLength > 8 && v.getUint32(0) === 0x89504E47) { // PNG: list text/exif chunks
    let o = 8;
    while (o + 8 < v.byteLength) {
      const len = v.getUint32(o), type = ascii(o + 4, 4);
      if (type === 'tEXt') { const s = ascii(o + 8, Math.min(len, 200)), i = s.indexOf('\0'); out['PNG ' + s.slice(0, i)] = s.slice(i + 1); }
      else if (['iTXt', 'zTXt', 'eXIf', 'tIME'].includes(type)) out['PNG ' + type] = 'Var';
      if (type === 'IEND') break;
      o += 12 + len;
    }
  }
  return out;
}
function parseExif(v, t, out) {
  const le = v.getUint16(t) === 0x4949, u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
  const readIFD = (off, tags) => {
    const res = {}, p = t + off;
    if (p + 2 > v.byteLength) return res;
    for (let i = 0, n = u16(p); i < n; i++) {
      const e = p + 2 + i * 12;
      if (e + 12 > v.byteLength) break;
      const tag = u16(e), type = u16(e + 2), cnt = u32(e + 4);
      if (!(tag in tags)) continue;
      if (type === 2) {
        const vo = cnt > 4 ? t + u32(e + 8) : e + 8; let s = '';
        for (let k = 0; k < cnt - 1 && vo + k < v.byteLength; k++) s += String.fromCharCode(v.getUint8(vo + k));
        res[tags[tag]] = s.trim();
      } else res[tags[tag]] = type === 3 ? u16(e + 8) : u32(e + 8);
    }
    return res;
  };
  const ifd0 = readIFD(u32(t + 4), { 0x010F: 'Make', 0x0110: 'Model', 0x0131: 'Software', 0x0132: 'DateTime', 0x013B: 'Artist', 0x0112: 'Orientation', 0x8769: '_exif', 0x8825: '_gps' });
  for (const [k, val] of Object.entries(ifd0)) if (!k.startsWith('_')) out[k] = val;
  if (ifd0._exif) Object.assign(out, readIFD(ifd0._exif, { 0x9003: 'DateTimeOriginal', 0xA434: 'LensModel' }));
  if (ifd0._gps !== undefined) out['GPS'] = '⚠ Konum bilgisi var';
}
async function metadataTool(f) {
  const img = await loadImage(f.url), meta = await readMeta(f.blob);
  const m = openModal('Metadata', { primary: 'Remove Metadata', reset: false });
  const base = { 'Ad': f.name, 'Tür': f.blob.type || '—', 'Boyut': fmtSize(f.blob.size), 'Çözünürlük': `${img.naturalWidth} × ${img.naturalHeight}px` };
  if (f.blob.lastModified) base['Değiştirilme'] = new Date(f.blob.lastModified).toLocaleString('tr-TR');
  const tr = (k, val) => h('tr', {}, h('td', {}, k), h('td', { class: k === 'GPS' ? 'warn' : '' }, String(val)));
  const hasMeta = Object.keys(meta).length > 0;
  m.body.append(
    h('table', { class: 'meta' }, Object.entries(base).map(([k, val]) => tr(k, val))),
    h('div', { class: 'note' }, hasMeta ? 'Gömülü metadata:' : 'Gömülü metadata (EXIF/XMP/PNG text) bulunamadı.'),
    hasMeta ? h('table', { class: 'meta' }, Object.entries(meta).map(([k, val]) => tr(k, val))) : null,
    h('div', { class: 'note' }, LANG === 'tr'
      ? '“Üstveriyi Sil” görseli yeniden kodlar; EXIF, GPS ve diğer gömülü bilgiler silinmiş temiz bir kopya oluşturur.'
      : '“Remove Metadata” re-encodes the image into a clean copy without EXIF, GPS or other embedded data.'));
  m.onSave = async () => {
    const c = canvasOf(img.naturalWidth, img.naturalHeight);
    c.getContext('2d').drawImage(img, 0, 0);
    const t = keepType(f);
    return [{ blob: await exportCanvas(c, t, .95), name: named(f, 'Clean', t) }];
  };
  return m.result;
}

updateEmpty();

// ---------- Electron: global overlay wheel + tool windows
const MIME = { pdf: 'application/pdf', zip: 'application/zip', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', bmp: 'image/bmp',
  avif: 'image/avif', svg: 'image/svg+xml', txt: 'text/plain', md: 'text/markdown', csv: 'text/csv', json: 'application/json', log: 'text/plain', html: 'text/html', htm: 'text/html', xml: 'text/xml' };
const dirOf = p => p ? p.replace(/[\\/][^\\/]*$/, '') : '';
async function saveOutputs(outs, srcPath) {
  if (outs[0].renameTo) {
    const p = await window.desktop.rename(srcPath, outs[0].renameTo);
    return window.desktop.notify('✓ ' + p.split(/[\\/]/).pop(), p);
  }
  let last;
  for (const o of outs) last = await window.desktop.save(dirOf(srcPath), o.name, new Uint8Array(await o.blob.arrayBuffer()));
  window.desktop.notify('✓ ' + (outs.length > 1 ? `${outs.length} dosya kaydedildi` : outs[0].name), last);
}
if (DESKTOP_MODE) document.body.classList.add('desktop', DESKTOP_MODE);
// Tool and help windows must never swallow a file dropped on them (only the wheel takes drops).
if (DESKTOP_MODE && DESKTOP_MODE !== 'wheel') for (const ev of ['dragover', 'drop']) window.addEventListener(ev, e => { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; });

if (DESKTOP_MODE === 'wheel') {
  const D = window.desktop;
  let kind = null, at = { x: innerWidth / 2, y: innerHeight / 2 };
  const show = k => { kind = k; openWheel(at.x, at.y, k); };
  // main places the window around the cursor (kept on screen) and tells us where the cursor is in it
  D.onShow(info => {
    at = { x: info?.cx ?? innerWidth / 2, y: info?.cy ?? innerHeight / 2 };
    wheel.win = { x: info?.winX ?? 0, y: info?.winY ?? 0 };
    wheel.wantGlass = !!info?.glass && info.glass <= glassCache.at; // only a snapshot from this drag
    show('other');
  });
  D.onGlass(g => prepareGlass(g));
  D.onHide(closeWheel);
  D.onCycle(() => { if (wheel.open) cycleMode(); });
  const over = e => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    const k = dragKind(e);
    if (!wheel.open || k !== kind) show(k);
    updateHover(e.clientX, e.clientY);
  };
  window.addEventListener('dragenter', over);
  window.addEventListener('dragover', over);
  window.addEventListener('dragleave', () => setHover(null));
  window.addEventListener('drop', async e => {
    e.preventDefault();
    const act = wheel.hover;
    const list = [...e.dataTransfer.files].map(file => ({ file, path: D.pathFor(file) }));
    closeWheel(); D.hide();
    if (!act) return;
    const items = list.map(({ file, path }) => ({ path, name: file.name, blob: file, kind: kindOf(file.type, file.name) }))
      .filter(f => ACTIONS[f.kind]?.[act]);
    if (!items.length) return;
    const all = wheel.def.items.flatMap(i => i.items || [i]), label = t(all.find(i => i.id === act)?.label || act);
    const run = async (a, arg, path) => {
      D.progress({ state: 'working', title: label, sub: t('İşleniyor…') });
      try {
        const fs = [].concat(arg);
        fs.forEach(f => f.url = URL.createObjectURL(f.blob));
        const outs = await a.run(arg);
        fs.forEach(f => URL.revokeObjectURL(f.url));
        if (outs?.length) await saveOutputs(outs, path);
      } catch (err) { console.error(err); D.notify('Hata: ' + (err.message || err)); }
    };
    const first = ACTIONS[items[0].kind][act];
    if (first.multi) return run(first, items, items[0].path); // e.g. many files → one ZIP / one PDF
    for (const f of items) {
      const a = ACTIONS[f.kind][act];
      if (a.modal) D.openEditor(f.path, act); else await run(a, f, f.path);
    }
  });
}

if (DESKTOP_MODE === 'toast') {
  const ic = h('div', { class: 'ic', html: svgIcon('convert') }), tt = h('div', { class: 'tt' }), ts = h('div', { class: 'ts' });
  const go = h('button', { class: 'btn soft go', hidden: '' }, t('Göster')), bar = h('div', { class: 'bar' }, h('i'));
  const card = h('div', { class: 'tcard out' }, ic, tt, go, ts, bar);
  document.body.append(card);
  let file = null;
  go.onclick = () => file && window.desktop.reveal(file);
  window.desktop.onProgress(s => {
    if (s.state === 'hide') { card.classList.add('out'); setTimeout(() => window.desktop.toastHidden(), 300); return; }
    card.classList.remove('working', 'done', 'error', 'out');
    card.classList.add(s.state);
    file = s.file || null;
    ic.innerHTML = s.state === 'working' ? svgIcon('convert') : s.state === 'error' ? '<b>!</b>' : '<b>✓</b>';
    tt.textContent = s.state === 'done' ? (s.title || '').replace(/^✓\s*/, '') : s.title || '';
    ts.textContent = s.state === 'working' ? s.sub || '' : s.state === 'done' ? t('Kaydedildi') + (file ? ' · ' + file.replace(/[\\/][^\\/]*$/, '') : '') : '';
    go.hidden = !file;
  });
}

if (DESKTOP_MODE === 'help') (async () => {
  const m = openModal('Drag + Shift', { primary: 'Tamam', reset: false });
  m.body.append(
    h('div', { class: 'helpok' }, h('i'), t('Arka planda çalışıyor')),
    h('ol', { class: 'steps' },
      h('li', {}, 'Masaüstünde ya da Explorer\'da bir dosyayı tut ve sürükle.'),
      h('li', {}, 'Sürüklerken ', h('kbd', {}, 'Shift'), '\'e bas — imlecin altında çark açılır.'),
      h('li', {}, 'Dosyayı bir işlemin üstüne bırak; sonuç dosyanın yanına kaydedilir.'),
      h('li', {}, 'Görsellerde tekrar ', h('kbd', {}, 'Shift'), ' = Convert çarkı. ', h('kbd', {}, 'Esc'), ' = kapat.')),
    h('div', { class: 'note' }, 'Bu pencereyi kapatabilirsin; uygulama saatin yanındaki turuncu noktada çalışmaya devam eder.'));
  m.onSave = async () => null;
  await m.result;
  window.desktop.close();
})();

if (DESKTOP_MODE === 'editor') (async () => {
  const D = window.desktop, q = new URLSearchParams(location.search), path = q.get('file'), tool = q.get('tool');
  try {
    const name = path.split(/[\\/]/).pop(), ext = (name.match(/\.([^.]+)$/)?.[1] || '').toLowerCase();
    const blob = new Blob([await D.read(path)], { type: MIME[ext] || '' });
    const f = { name, blob, kind: kindOf(blob.type, name), url: URL.createObjectURL(blob) };
    const a = ACTIONS[f.kind][tool];
    const outs = await (a.multi ? a.run([f]) : a.run(f));
    if (outs?.length) await saveOutputs(outs, path);
  } catch (err) { console.error(err); D.notify('Hata: ' + (err.message || err)); }
  D.close();
})();
